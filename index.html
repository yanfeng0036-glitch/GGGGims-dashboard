<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球消费者索赔情报仪表盘</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 border-b pb-4 flex justify-between items-center flex-wrap gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-gray-900">🌐 美/加/澳 索赔案件实时监控</h1>
                <p class="text-sm text-gray-500 mt-1">按案件总金额排序 | 自动高亮优质申领通道</p>
            </div>
            <div id="update-time" class="text-xs bg-gray-200 px-3 py-1 rounded-full text-gray-600">更新中...</div>
        </header>
        <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-12 text-gray-400">正在加载最新案件数据...</div>
        </div>
    </div>
    <script>
        async function loadData() {
            try {
                const res = await fetch('data.json');
                const data = await res.json();
                document.getElementById('update-time').innerText = '最后更新: ' + data.updated_at;
                const container = document.getElementById('cards-container');
                container.innerHTML = '';
                if (!data.items || data.items.length === 0) {
                    container.innerHTML = '<div class="col-span-full text-center py-12 text-gray-500">目前暂无未过期案件。</div>';
                    return;
                }
                data.items.forEach(item => {
                    let tagsHtml = '';
                    if (item.is_consumer_goods) tagsHtml += '<span class="bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded font-medium mr-1">🛒 消费购物类</span>';
                    if (item.no_proof_required) tagsHtml += '<span class="bg-red-100 text-red-800 text-xs px-2 py-0.5 rounded font-bold mr-1">🔥 免凭证</span>';
                    if (item.no_invite_code) tagsHtml += '<span class="bg-green-100 text-green-800 text-xs px-2 py-0.5 rounded font-medium mr-1">🔓 免邀请码</span>';

                    const card = `
                        <div class="bg-white rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition p-5 flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start mb-2">
                                    <span class="text-xs font-semibold px-2 py-0.5 bg-gray-100 text-gray-600 rounded">${item.country || 'US'}</span>
                                    <span class="text-xs text-red-500 font-medium">⏳ 截止: ${item.deadline}</span>
                                </div>
                                <h2 class="font-bold text-lg text-gray-900 mb-2 leading-snug">${item.title}</h2>
                                <div class="mb-3 flex flex-wrap gap-1">${tagsHtml}</div>
                                <p class="text-sm text-gray-600 mb-4 line-clamp-3">${item.summary}</p>
                            </div>
                            <div>
                                <div class="bg-gray-50 rounded-lg p-3 mb-4 grid grid-cols-2 gap-2 text-center">
                                    <div><div class="text-xs text-gray-400">预估单人赔付</div><div class="text-base font-bold text-emerald-600">${item.payout_per_person}</div></div>
                                    <div><div class="text-xs text-gray-400">总赔偿池</div><div class="text-base font-bold text-indigo-600">${item.total_fund_display}</div></div>
                                </div>
                                <a href="${item.official_url}" target="_blank" class="block w-full text-center bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm py-2 rounded-lg transition">前往申领 ↗</a>
                            </div>
                        </div>`;
                    container.innerHTML += card;
                });
            } catch (err) {
                document.getElementById('cards-container').innerHTML = '<div class="col-span-full text-center text-red-500 py-12">数据生成中，请等待后台执行完毕。</div>';
            }
        }
        loadData();
    </script>
</body>
</html>
